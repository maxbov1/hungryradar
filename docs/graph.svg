<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" role="img" aria-labelledby="title desc">
  <title id="title">HungryRadar investigation lifecycle graph</title>
  <desc id="desc">Seven checklist nodes form a circle around a central repair and continue controller. Solid arrows move clockwise. Dashed arrows backtrack to repair stale or conflicting evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="back-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #64748b; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .node-title { font: 700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #0f172a; }
      .node-step { font: 700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #64748b; }
      .check { font: 400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #334155; }
      .edge { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .back-edge { fill: none; stroke: #8b5cf6; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#back-arrow); }
      .controller { fill: #eef2ff; stroke: #6366f1; stroke-width: 3; }
      .controller-title { font: 700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #312e81; }
      .controller-copy { font: 400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #4338ca; }
      .terminal { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .terminal-text { font: 700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #334155; }
      .legend { font: 400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1500" height="1050" fill="#f8fafc"/>
  <text x="750" y="42" text-anchor="middle" class="title">HungryRadar investigation lifecycle</text>
  <text x="750" y="70" text-anchor="middle" class="subtitle">Evidence moves clockwise. The controller sends the agent backward when a check is stale, missing, or contradictory.</text>

  <!-- Clockwise loop edges. -->
  <path class="edge" d="M750 177 C910 165 1045 212 1118 302"/>
  <path class="edge" d="M1172 386 C1220 505 1182 628 1088 688"/>
  <path class="edge" d="M1015 785 C890 878 760 902 668 885"/>
  <path class="edge" d="M565 885 C430 900 315 850 272 766"/>
  <path class="edge" d="M210 680 C155 575 178 450 254 386"/>
  <path class="edge" d="M338 300 C430 212 565 166 670 177"/>

  <!-- Central controller links. -->
  <path class="edge" d="M750 355 L750 295"/>
  <path class="edge" d="M925 450 L1040 450"/>
  <path class="edge" d="M900 610 L1010 720"/>
  <path class="edge" d="M600 610 L490 720"/>
  <path class="edge" d="M575 450 L460 450"/>

  <!-- Repair edges. -->
  <path class="back-edge" d="M1060 270 C920 112 600 92 390 205"/>
  <path class="back-edge" d="M1120 700 C1110 955 830 1000 690 930"/>
  <path class="back-edge" d="M430 730 C300 650 300 475 365 380"/>
  <text x="980" y="112" class="legend" fill="#8b5cf6">repair / backtrack</text>

  <!-- Central controller. -->
  <circle cx="750" cy="500" r="145" class="controller" filter="url(#shadow)"/>
  <text x="750" y="467" text-anchor="middle" class="controller-title">REPAIR / CONTINUE</text>
  <text x="750" y="497" text-anchor="middle" class="controller-copy">record evidence</text>
  <text x="750" y="520" text-anchor="middle" class="controller-copy">check node boxes</text>
  <text x="750" y="543" text-anchor="middle" class="controller-copy">choose next allowed edge</text>

  <!-- Request node. -->
  <g filter="url(#shadow)">
    <rect x="600" y="105" width="300" height="110" rx="16" class="node"/>
    <text x="625" y="134" class="node-step">01</text>
    <text x="665" y="134" class="node-title">REQUEST</text>
    <text x="625" y="163" class="check">☐ party, date, and time</text>
    <text x="625" y="187" class="check">☐ intent is clear</text>
  </g>

  <!-- Place node. -->
  <g filter="url(#shadow)">
    <rect x="1030" y="245" width="300" height="115" rx="16" class="node"/>
    <text x="1055" y="274" class="node-step">02</text>
    <text x="1095" y="274" class="node-title">PLACE</text>
    <text x="1055" y="303" class="check">☐ one Google Place ID</text>
    <text x="1055" y="327" class="check">☐ identity confirmed</text>
    <text x="1055" y="351" class="check">☐ ambiguity resolved</text>
  </g>

  <!-- Context node. -->
  <g filter="url(#shadow)">
    <rect x="1080" y="445" width="300" height="115" rx="16" class="node"/>
    <text x="1105" y="474" class="node-step">03</text>
    <text x="1145" y="474" class="node-title">CONTEXT</text>
    <text x="1105" y="503" class="check">☐ Google Place snapshot</text>
    <text x="1105" y="527" class="check">☐ requested-time hours</text>
    <text x="1105" y="551" class="check">☐ booking path found</text>
  </g>

  <!-- Reservation node. -->
  <g filter="url(#shadow)">
    <rect x="930" y="700" width="300" height="115" rx="16" class="node"/>
    <text x="955" y="729" class="node-step">04</text>
    <text x="995" y="729" class="node-title">RESERVATION</text>
    <text x="955" y="758" class="check">☐ source checked</text>
    <text x="955" y="782" class="check">☐ result is fresh</text>
    <text x="955" y="806" class="check">☐ available or no table</text>
  </g>

  <!-- Waitlist node. -->
  <g filter="url(#shadow)">
    <rect x="600" y="835" width="300" height="115" rx="16" class="node"/>
    <text x="625" y="864" class="node-step">05</text>
    <text x="665" y="864" class="node-title">WAITLIST</text>
    <text x="625" y="893" class="check">☐ checked after no table</text>
    <text x="625" y="917" class="check">☐ result is fresh</text>
    <text x="625" y="941" class="check">☐ available or absent</text>
  </g>

  <!-- Visit risk node. -->
  <g filter="url(#shadow)">
    <rect x="270" y="700" width="300" height="115" rx="16" class="node"/>
    <text x="295" y="729" class="node-step">06</text>
    <text x="335" y="729" class="node-title">VISIT RISK</text>
    <text x="295" y="758" class="check">☐ target-time signal</text>
    <text x="295" y="782" class="check">☐ wait tolerance applied</text>
    <text x="295" y="806" class="check">☐ missing data is explicit</text>
  </g>

  <!-- Walk-in node. -->
  <g filter="url(#shadow)">
    <rect x="120" y="445" width="300" height="115" rx="16" class="node"/>
    <text x="145" y="474" class="node-step">07</text>
    <text x="185" y="474" class="node-title">WALK-IN</text>
    <text x="145" y="503" class="check">☐ official policy checked</text>
    <text x="145" y="527" class="check">☐ service constraints</text>
    <text x="145" y="551" class="check">☐ credible or unknown</text>
  </g>

  <!-- Terminal outcomes. -->
  <g>
    <rect x="1280" y="650" width="170" height="44" rx="22" class="terminal"/>
    <text x="1365" y="678" text-anchor="middle" class="terminal-text">BOOKABLE</text>
    <path class="edge" d="M1230 735 C1260 715 1270 690 1280 675"/>

    <rect x="1030" y="875" width="210" height="44" rx="22" class="terminal"/>
    <text x="1135" y="903" text-anchor="middle" class="terminal-text">WAITLIST AVAILABLE</text>
    <path class="edge" d="M1050 815 C1070 840 1095 860 1110 875"/>

    <rect x="70" y="875" width="190" height="44" rx="22" class="terminal"/>
    <text x="165" y="903" text-anchor="middle" class="terminal-text">HIGH WAIT RISK</text>
    <path class="edge" d="M300 815 C265 840 240 860 220 875"/>

    <rect x="20" y="650" width="210" height="44" rx="22" class="terminal"/>
    <text x="125" y="678" text-anchor="middle" class="terminal-text">WALK-IN POSSIBLE</text>
    <path class="edge" d="M170 560 C150 590 135 625 125 650"/>

    <rect x="30" y="245" width="230" height="44" rx="22" class="terminal"/>
    <text x="145" y="273" text-anchor="middle" class="terminal-text">UNKNOWN / DEAD END</text>
    <path class="edge" d="M190 445 C165 390 150 335 145 289"/>
  </g>

  <line x1="560" y1="1000" x2="600" y2="1000" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="615" y="1005" class="legend">forward transition</text>
  <line x1="820" y1="1000" x2="860" y2="1000" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#back-arrow)"/>
  <text x="875" y="1005" class="legend">repair / backtrack</text>
</svg>
