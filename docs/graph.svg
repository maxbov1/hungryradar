<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">HungryRadar agent investigation loop</title>
  <desc id="desc">Seven small checklist nodes form a quiet circular loop around one central controller. A solid arrow shows forward progress and one dashed arc shows backtracking.</desc>
  <defs>
    <marker id="forward" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#475569"/>
    </marker>
    <marker id="back" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .heading { font: 700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #0f172a; }
      .subheading { font: 400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #64748b; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .number { font: 700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #94a3b8; }
      .label { font: 700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #1e293b; }
      .check { font: 400 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #475569; }
      .forward { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#forward); }
      .backtrack { fill: none; stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#back); }
      .center { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; }
      .center-label { font: 700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #4c1d95; }
      .center-copy { font: 400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #6d28d9; }
      .outcomes { font: 400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="900"/>
  <text x="600" y="38" text-anchor="middle" class="heading">HungryRadar agent investigation loop</text>
  <text x="600" y="64" text-anchor="middle" class="subheading">Each node must complete its checklist before the loop moves forward.</text>

  <!-- One quiet clockwise ring. -->
  <path class="forward" d="M600 128 A320 320 0 1 1 599 128"/>
  <path class="forward" d="M760 171 A320 320 0 0 1 805 200"/>

  <!-- One repair path. -->
  <path class="backtrack" d="M700 775 C980 735 1040 380 820 235"/>

  <!-- Center controller. -->
  <circle cx="600" cy="430" r="112" class="center" filter="url(#shadow)"/>
  <text x="600" y="408" text-anchor="middle" class="center-label">REPAIR / CONTINUE</text>
  <text x="600" y="435" text-anchor="middle" class="center-copy">record evidence</text>
  <text x="600" y="456" text-anchor="middle" class="center-copy">check the boxes</text>
  <text x="600" y="477" text-anchor="middle" class="center-copy">take the next allowed edge</text>

  <!-- 01 Inputs -->
  <g filter="url(#shadow)">
    <rect x="490" y="86" width="220" height="86" rx="12" class="card"/>
    <text x="510" y="110" class="number">01</text><text x="548" y="110" class="label">INPUTS</text>
    <text x="510" y="136" class="check">☐ party, date, and time</text>
    <text x="510" y="157" class="check">☐ intent is clear</text>
  </g>

  <!-- 02 Identify listings -->
  <g filter="url(#shadow)">
    <rect x="840" y="155" width="220" height="86" rx="12" class="card"/>
    <text x="860" y="179" class="number">02</text><text x="898" y="179" class="label">IDENTIFY LISTINGS</text>
    <text x="860" y="205" class="check">☐ candidates found</text>
    <text x="860" y="226" class="check">☐ Google Place IDs resolved</text>
  </g>

  <!-- 03 Check availability -->
  <g filter="url(#shadow)">
    <rect x="930" y="350" width="220" height="86" rx="12" class="card"/>
    <text x="950" y="374" class="number">03</text><text x="988" y="374" class="label">CHECK AVAILABILITY</text>
    <text x="950" y="400" class="check">☐ reservation checked</text>
    <text x="950" y="421" class="check">☐ waitlist / wait risk checked</text>
  </g>

  <!-- 04 Check reservation form -->
  <g filter="url(#shadow)">
    <rect x="840" y="585" width="220" height="86" rx="12" class="card"/>
    <text x="860" y="609" class="number">04</text><text x="898" y="609" class="label">CHECK FORM</text>
    <text x="860" y="635" class="check">☐ fields are present</text>
    <text x="860" y="656" class="check">☐ matches internal data</text>
  </g>

  <!-- 05 Propose and confirm -->
  <g filter="url(#shadow)">
    <rect x="490" y="700" width="220" height="86" rx="12" class="card"/>
    <text x="510" y="724" class="number">05</text><text x="548" y="724" class="label">PROPOSE / CONFIRM</text>
    <text x="510" y="750" class="check">☐ proposal shown</text>
    <text x="510" y="771" class="check">☐ user confirms</text>
  </g>

  <!-- 06 Book -->
  <g filter="url(#shadow)">
    <rect x="140" y="585" width="220" height="86" rx="12" class="card"/>
    <text x="160" y="609" class="number">06</text><text x="198" y="609" class="label">BOOK</text>
    <text x="160" y="635" class="check">☐ confirmed details sent</text>
    <text x="160" y="656" class="check">☐ booking succeeds</text>
  </g>

  <text x="600" y="842" text-anchor="middle" class="outcomes">Outcomes: Booked · Waitlist available · No match · Unknown</text>
  <text x="600" y="868" text-anchor="middle" class="outcomes" fill="#7c3aed">Solid ring = forward progress    Dashed arc = backtrack and repair</text>
</svg>
